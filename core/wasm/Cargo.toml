[package]
name = "instrument-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM binding over the instrument engine (StreamSynth) for browser AudioWorklets."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engine = { path = "../engine" }
wasm-bindgen = "0.2"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]

# Smaller/faster wasm; the workspace release profile (lto, codegen-units=1)
# already applies. wasm-opt is run by wasm-pack.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
